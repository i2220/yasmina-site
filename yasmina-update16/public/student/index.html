<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حساب الطالب · يسمينا</title>
<meta name="theme-color" content="#0a2166">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a2166;--bg2:#1a47c9;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--ink:#fff;--muted:#b9c7f5;--y:#ffe500;--ok:#38d68a;--warn:#ffb24d;--bad:#ff7a7a}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:#1a47c9}
body{font-family:Cairo,"Noto Sans Arabic",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2) 55%,#2c63e6);min-height:100vh;line-height:1.7;padding-bottom:40px}
.wrap{max-width:980px;margin-inline:auto;padding:0 16px}
header{display:flex;align-items:center;gap:12px;padding:16px 0}
header .logo{display:flex;align-items:center;gap:10px;flex:1}
header .logo svg{width:38px;height:38px}
header b{font-weight:900;font-size:28px;color:var(--y);line-height:1}
header small{display:block;color:var(--muted);font-size:13px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:99px;min-height:44px;padding:0 22px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#0a2166;background:var(--y)}
.ghost{background:transparent;color:#fff;border:1.5px solid var(--line)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;backdrop-filter:blur(6px)}
/* login */
.login{max-width:430px;margin:6vh auto 0;display:grid;gap:14px;text-align:center}
.login h1{font-weight:900;font-size:30px}
.login p{color:var(--muted)}
.login label{display:grid;gap:4px;text-align:right;font-weight:700}
.login input{font:inherit;font-size:18px;min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.12);color:#fff;padding:0 16px;direction:ltr;text-align:center;letter-spacing:.06em}
.login .err,.err{color:#ffc9c9;font-weight:700;min-height:1.4em}
/* dashboard */
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.hello .av{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.hello h1{font-weight:900;font-size:clamp(24px,4.6vw,34px);line-height:1.3}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:2px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-block:14px}
.donut{display:grid;justify-items:center;gap:8px;text-align:center}
.donut svg{width:min(100%,170px);height:auto;overflow:visible}
.donut .trk{fill:none;stroke:rgba(255,255,255,.16);stroke-width:13}
.donut .bar{fill:none;stroke-width:13;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.donut .pc{font-weight:900;font-size:30px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.donut h3{font-weight:800;font-size:16px}
.donut p{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stat{text-align:center}
.stat b{display:block;font-weight:900;font-size:clamp(30px,6vw,44px);line-height:1.1;color:var(--y);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:700;font-size:14px}
.next{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px;background:linear-gradient(120deg,rgba(255,229,0,.18),rgba(255,255,255,.07));border-color:rgba(255,229,0,.5)}
.next small{color:var(--muted);font-weight:700}.next b{display:block;font-weight:900;font-size:20px}
h2.sec{font-weight:900;font-size:20px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--y)}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.ring{display:grid;justify-items:center;gap:4px;text-align:center}
.ring svg{width:88px;height:88px}.ring .trk{stroke-width:10}.ring .bar{stroke-width:10}.ring .pc{font-size:22px}
.ring span{font-weight:700;font-size:14px}
.trend svg{width:100%;height:auto}
.rep{padding:0;overflow:hidden}
.rep summary{list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;cursor:pointer}
.rep summary::-webkit-details-marker{display:none}
.rep summary .t{flex:1 1 180px;min-width:0}.rep summary b{display:block;font-weight:800}
.rep summary small{color:var(--muted)}
.badge{padding:2px 14px;border-radius:99px;font-weight:900;font-size:14px;color:#0a2166}
.rep .body{padding:0 18px 18px;display:grid;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.sk{display:grid;grid-template-columns:90px 1fr 38px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.sk u{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;text-decoration:none}
.sk i{display:block;height:100%;border-radius:99px}
.tx h4{font-weight:800;color:var(--y);font-size:14px}.tx p{color:#eaf0ff;white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pill{display:inline-block;margin:2px 0 2px 6px;padding:1px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--line)}
.teacher{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px}
.teacher img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--y)}
.empty{color:var(--muted);text-align:center;padding:18px}
@media (max-width:640px){.grid3{grid-template-columns:1fr}.two{grid-template-columns:1fr}.donut{grid-template-columns:auto 1fr;justify-items:start;text-align:right;align-items:center;gap:6px 16px}.donut svg{width:120px;grid-row:span 2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="-30 -30 60 60" aria-hidden="true"><g id="lg"></g></svg>
      <div><b>يسمينا</b><small>حساب الطالب</small></div>
    </div>
    <button class="ghost" id="logout" type="button" hidden>خروج</button>
  </header>

  <main id="loginView">
    <form class="card login" id="loginForm">
      <h1>أهلًا بك 👋</h1>
      <p>اكتب بيانات الدخول التي أرسلتها لك المعلمة على واتساب لمتابعة الحصص والتقارير.</p>
      <label>اسم المستخدم<input id="user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ys1001"></label>
      <label>كلمة المرور<input id="pass" type="password" inputmode="text" autocomplete="current-password" placeholder="•••••"></label>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="go">دخول</button>
      <a class="ghost btn" href="/">العودة إلى الموقع</a>
    </form>
  </main>

  <main id="app" hidden>
    <div class="hello">
      <div class="av"><svg viewBox="-30 -30 60 60" width="40" height="40" aria-hidden="true"><g id="lg2"></g></svg></div>
      <div><h1 id="hi"></h1><div class="chips" id="chips"></div></div>
    </div>

    <section class="card next" id="next" hidden>
      <div><small>الحصة القادمة</small><b id="nextWhen"></b></div>
      <a class="btn" id="nextGo" target="_blank" rel="noopener">ادخل الحصة على زووم</a>
    </section>

    <section class="grid3" id="donuts"></section>
    <section class="stats" id="stats"></section>

    <h2 class="sec" id="skillsH" hidden>مهارات الطالب في آخر تقرير</h2>
    <section class="card rings" id="rings" hidden></section>

    <h2 class="sec" id="trendH" hidden>تطوّر المستوى عبر الحصص</h2>
    <section class="card trend" id="trend" hidden></section>

    <h2 class="sec">تقارير الحصص</h2>
    <section id="reports" style="display:grid;gap:12px"></section>

    <section class="card teacher" id="teacher" hidden>
      <img id="tImg" alt="" hidden>
      <div style="flex:1"><b id="tName"></b><div class="hint" id="tPlace" style="color:var(--muted)"></div></div>
      <a class="btn" id="tWa" target="_blank" rel="noopener">تواصل مع المعلمة</a>
    </section>
  </main>
</div>
<script src="/admin/docs.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined&&x!==null)e.textContent=x;return e};
  const NS='http://www.w3.org/2000/svg';
  const svg=(t,a)=>{const e=document.createElementNS(NS,t);Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));return e};
  let DATA=null;

  // the logo flower
  function flower(g,petal){
    for(let i=0;i<5;i++){const p=svg('path',{d:'M0 0C9 -3 8 -17 0 -18C-8 -17 -9 -3 0 0Z',fill:petal||'#fff',transform:'rotate('+(i*72)+')',stroke:'rgba(10,33,102,.25)','stroke-width':'.6'});g.append(p)}
    g.append(svg('circle',{r:5.4,fill:'#ff5a1f'}),svg('circle',{r:2.4,fill:'#ffb000'}));
  }
  flower($('lg'));flower($('lg2'),'#1a47c9');

  const color=p=>p>=80?'#38d68a':p>=60?'#7fb0ff':p>=40?'#ffb24d':'#ff7a7a';
  const verdict=p=>p>=90?'ممتاز':p>=76?'جيد جدًا':p>=60?'جيد':p>0?'يحتاج إلى دعم':'—';
  function donut(pct,title,sub,big){
    const r=big===false?38:62,c=2*Math.PI*r,box=big===false?100:160,mid=box/2;
    const wrap=el('div','donut');
    const s=svg('svg',{viewBox:'0 0 '+box+' '+box,role:'img','aria-label':title+' '+pct+'%'});
    s.append(svg('circle',{class:'trk',cx:mid,cy:mid,r}));
    const bar=svg('circle',{class:'bar',cx:mid,cy:mid,r,stroke:color(pct),'stroke-dasharray':c,'stroke-dashoffset':c});
    s.append(bar);const t=svg('text',{class:'pc',x:mid,y:mid});t.textContent=pct+'%';s.append(t);
    wrap.append(s);
    if(title){wrap.append(el('h3','',title));wrap.append(el('p','',sub||''))}
    requestAnimationFrame(()=>requestAnimationFrame(()=>bar.setAttribute('stroke-dashoffset',c*(1-Math.max(0,Math.min(100,pct))/100))));
    return wrap;
  }
  const score=d=>window.YSDocs?YSDocs.reportScore(d):0;
  function slot(s){
    const m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(s||'');if(!m)return s||'';
    const day=new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(Date.UTC(+m[1],+m[2]-1,+m[3])));
    const h=+m[4];return day+' · '+((h+11)%12+1)+':'+m[5]+' '+(h<12?'ص':'م')+' بتوقيت الكويت';
  }

  function render(){
    const {student:s,reports,teacher}=DATA;
    $('hi').textContent='أهلًا '+s.child;
    const ch=$('chips');ch.textContent='';[s.grade,s.plan,'رقم الحجز '+s.code].filter(Boolean).forEach(t=>ch.append(el('span','chip',t)));
    if(s.next){$('next').hidden=false;$('nextWhen').textContent=slot(s.next.start);$('nextGo').href=s.next.link}
    const scored=reports.map(r=>({r,p:score(r.data)})).filter(x=>x.p>0);
    const last=scored[scored.length-1],avg=scored.length?Math.round(scored.reduce((a,x)=>a+x.p,0)/scored.length):0;
    const pk=s.lessons_total?Math.round(s.lessons_done/s.lessons_total*100):0;
    const dn=$('donuts');dn.textContent='';
    const c1=el('div','card');c1.append(donut(pk,'تقدّم الباقة',s.lessons_total?'تمت '+s.lessons_done+' من '+s.lessons_total+' حصص':'لم تُحدَّد حصص الباقة بعد'));
    const c2=el('div','card');c2.append(donut(last?last.p:0,'المستوى الحالي',last?verdict(last.p)+' · آخر تقرير':'بانتظار أول تقرير'));
    const c3=el('div','card');c3.append(donut(avg,'متوسط التقييم',scored.length?'عبر '+scored.length+' تقارير':'بانتظار التقارير'));
    dn.append(c1,c2,c3);
    const st=$('stats');st.textContent='';
    [['حصص متبقية',s.lessons_left],['حصص تمت',s.lessons_done],['تقارير',reports.length]].forEach(([l,v])=>{const c=el('div','card stat');c.append(el('b','',v),el('span','',l));st.append(c)});

    // skills rings from the last report
    if(last&&window.YSDocs){
      const d=last.r.data,box=$('rings');box.textContent='';let n=0;
      YSDocs.SKILLS.forEach(([k,l])=>{if(!YSDocs.shown(d,'skills',k))return;n++;const w=el('div','ring');w.append(donut(Math.round(d.skills[k]*20),null,null,false),el('span','',l));box.append(w)});
      $('skillsH').hidden=$('rings').hidden=!n;
    }
    // trend
    if(scored.length>=2){
      $('trendH').hidden=$('trend').hidden=false;const box=$('trend');box.textContent='';
      const W=640,H=200,pad=34,pts=scored.slice(-12);
      const sv=svg('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'تطوّر التقييم'});
      [0,50,100].forEach(v=>{const y=H-28-(v/100)*(H-56);sv.append(svg('line',{x1:pad,x2:W-10,y1:y,y2:y,stroke:'rgba(255,255,255,.18)'}));const t=svg('text',{x:pad-6,y:y+4,fill:'#b9c7f5','font-size':11,'text-anchor':'end'});t.textContent=v;sv.append(t)});
      const px=i=>W-20-(pts.length===1?0:i*((W-pad-30)/(pts.length-1))),py=v=>H-28-(v/100)*(H-56);
      sv.append(svg('polyline',{points:pts.map((x,i)=>px(i)+','+py(x.p)).join(' '),fill:'none',stroke:'#ffe500','stroke-width':3,'stroke-linejoin':'round'}));
      pts.forEach((x,i)=>{sv.append(svg('circle',{cx:px(i),cy:py(x.p),r:5,fill:'#0a2166',stroke:'#ffe500','stroke-width':3}));const t=svg('text',{x:px(i),y:py(x.p)-11,fill:'#fff','font-size':12,'font-weight':800,'text-anchor':'middle'});t.textContent=x.p+'%';sv.append(t);const d=svg('text',{x:px(i),y:H-8,fill:'#b9c7f5','font-size':10,'text-anchor':'middle'});d.textContent=String(x.r.data.date||'').slice(5);sv.append(d)});
      box.append(sv);
    }
    // reports
    const rp=$('reports');rp.textContent='';
    if(!reports.length)rp.append(el('div','card empty','ستظهر هنا تقارير الحصص بعد أن ترسلها المعلمة.'));
    reports.slice().reverse().forEach((r,idx)=>rp.append(reportCard(r,reports)));
    // teacher
    if(teacher&&teacher.name){
      $('teacher').hidden=false;$('tName').textContent='المعلمة '+teacher.name;$('tPlace').textContent=[teacher.city,teacher.area].filter(Boolean).join('، ');
      if(teacher.photo){$('tImg').src=teacher.photo;$('tImg').hidden=false}
      if(teacher.whatsapp){$('tWa').href='https://wa.me/'+teacher.whatsapp+'?text='+encodeURIComponent('السلام عليكم، بخصوص '+s.child+' ('+s.code+')')}else $('tWa').hidden=true;
    }
  }

  function reportCard(r,all){
    const d=r.data,p=score(d),det=el('details','card rep');
    const sm=el('summary'),t=el('div','t');
    t.append(el('b','',d.topic||'حصة إنجليزية'),el('small','',[d.date,d.sessionNo?'الحصة '+d.sessionNo:''].filter(Boolean).join(' · ')));
    sm.append(t);
    if(p){const b=el('span','badge',p+'% · '+verdict(p));b.style.background=color(p);sm.append(b)}
    det.append(sm);
    const body=el('div','body');
    const sk=YSDocs.SKILLS.filter(([k])=>YSDocs.shown(d,'skills',k));
    sk.forEach(([k,l])=>{const v=d.skills[k],row=el('div','sk');const u=el('u'),i=el('i');i.style.width=v*20+'%';i.style.background=color(v*20);u.append(i);row.append(el('span','',l),u,el('b','',v+'/5'));body.append(row)});
    const facts=[['المستوى',d.level],['التقدّم',d.progress],['الحضور',d.attendance],['الواجب السابق',d.homeworkStatus],['الاختبار القصير',d.score!==''&&d.score!=null?d.score+' / 10':'']].filter(x=>x[1]);
    if(facts.length){const f=el('div');facts.forEach(([k,v])=>{const s=el('span','pill');s.textContent=k+': '+v;f.append(s)});body.append(f)}
    const txt=(h,v)=>{if(!v)return;const x=el('div','tx');x.append(el('h4','',h),el('p','',v));body.append(x)};
    txt('أهداف الحصة',d.objectives);txt('كلمات وحروف جديدة',d.newWords);txt('ما أتقنه',d.mastered);
    const two=el('div','two');
    const lst=(h,arr,note)=>{if(!(arr&&arr.length)&&!note)return;const x=el('div','tx');x.append(el('h4','',h));(arr||[]).forEach(a=>x.append(el('span','pill',a)));if(note)x.append(el('p','',note));two.append(x)};
    lst('نقاط القوة',d.strengths,d.strengthsNote);lst('مجالات التطوير',d.improve,d.improveNote);
    if(two.children.length)body.append(two);
    txt('الواجب المنزلي',d.homework);txt('خطة الحصة القادمة',d.nextPlan);
    if((d.parentTips&&d.parentTips.length)||d.parentNote){const x=el('div','tx');x.append(el('h4','','توصيات لولي الأمر'));(d.parentTips||[]).forEach(a=>x.append(el('span','pill',a)));if(d.parentNote)x.append(el('p','',d.parentNote));body.append(x)}
    const dl=el('button','',null);dl.type='button';dl.textContent='تنزيل التقرير PDF';
    dl.addEventListener('click',async()=>{
      dl.disabled=true;dl.textContent='جارٍ التجهيز…';
      try{
        await YSDocs.ready();
        const hist=all.filter(x=>x.id<r.id).map(x=>({v:score(x.data),d:String(x.data.date||'').slice(5)})).filter(x=>x.v);
        const T=DATA.teacher||{};
        const brand={teacher:T.name||'',place:[T.city,T.area].filter(Boolean).join('، '),placeShort:[T.city,T.area].filter(Boolean).join(' · '),whatsapp:T.whatsapp||'',host:location.host};
        const blob=YSDocs.toPdf(YSDocs.report(Object.assign({code:'YS-R-'+(1000+r.id)},d),hist,brand));
        const a=el('a');a.href=URL.createObjectURL(blob);a.download='تقرير-'+(d.student||'')+'-'+(d.date||'')+'.pdf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      }catch(e){alert('تعذّر إنشاء الملف')}
      dl.disabled=false;dl.textContent='تنزيل التقرير PDF';
    });
    body.append(dl);det.append(body);
    return det;
  }

  async function load(){
    const r=await fetch('/api/student/me',{credentials:'same-origin'});
    if(r.status===401){show(false);return}
    const j=await r.json().catch(()=>null);
    if(!j||!j.ok){show(false);return}
    DATA=j;show(true);if(window.YSDocs)await YSDocs.ready();render();
  }
  function show(on){$('loginView').hidden=on;$('app').hidden=!on;$('logout').hidden=!on}
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();$('err').textContent='';$('go').disabled=true;
    try{
      const r=await fetch('/api/student/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});
      const j=await r.json().catch(()=>null);
      if(r.ok&&j&&j.ok){$('pass').value='';await load()}else $('err').textContent=(j&&j.error)||'تعذّر تسجيل الدخول.';
    }catch(_){$('err').textContent='تعذّر الاتصال. حاول مرة أخرى.'}
    $('go').disabled=false;
  });
  $('logout').addEventListener('click',async()=>{try{await fetch('/api/student/logout',{method:'POST',credentials:'same-origin'})}catch(_){}DATA=null;show(false)});
  load();
})();
</script>
</body>
</html>
